name: FitnessTrack
options:
  bundleIdPrefix: com.aphoh
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  FitnessTrack:
    type: application
    platform: iOS
    sources: [FitnessTrack]
    info:
      path: FitnessTrack/Resources/Info.plist
      properties:
        CFBundleDisplayName: FitnessTrack
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aphoh.fitnesstrack
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  FitnessTrackTests:
    type: bundle.unit-test
    platform: iOS
    sources: [FitnessTrackTests]
    dependencies:
      - target: FitnessTrack
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.aphoh.fitnesstrack.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/FitnessTrack.app/FitnessTrack"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  FitnessTrack:
    build:
      targets:
        FitnessTrack: all
        FitnessTrackTests: [test]
    test:
      targets: [FitnessTrackTests]
